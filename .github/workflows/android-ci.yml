name: Wavy Music Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Validate project and CI inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts || {
            echo "Missing settings.gradle.kts."
            exit 1
          }

          test -f build.gradle.kts || {
            echo "Missing root build.gradle.kts."
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "Missing app/build.gradle.kts."
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "Missing app AndroidManifest.xml."
            exit 1
          }

          test -s .github/android-sdk-packages.txt || {
            echo "Android SDK package list is missing or empty."
            exit 1
          }

          test -s .github/ci-tasks.txt || {
            echo "Gradle task list is missing or empty."
            exit 1
          }

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r package || [[ -n "$package" ]]; do
            package="${package%%#*}"
            package="$(printf '%s' "$package" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            [[ -z "$package" ]] && continue

            echo "Installing Android SDK package: $package"
            sdkmanager --install "$package"
          done < .github/android-sdk-packages.txt

      - name: Report Java, Android SDK, and Gradle versions
        shell: bash
        run: |
          set -euo pipefail

          java -version

          if [[ -f ./gradlew \
            && -f ./gradle/wrapper/gradle-wrapper.jar \
            && -f ./gradle/wrapper/gradle-wrapper.properties ]]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          sdkmanager --list_installed

      - name: Run unit tests, lint, and debug packaging
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tasks < <(
            sed -e '/^[[:space:]]*#/d' \
                -e '/^[[:space:]]*$/d' \
                .github/ci-tasks.txt
          )

          if (( ${#tasks[@]} == 0 )); then
            echo "No Gradle tasks configured."
            exit 1
          fi

          echo "Configured Gradle tasks:"
          printf '  %s\n' "${tasks[@]}"

          if [[ -f ./gradlew \
            && -f ./gradle/wrapper/gradle-wrapper.jar \
            && -f ./gradle/wrapper/gradle-wrapper.properties ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace "${tasks[@]}"
          else
            gradle --no-daemon --stacktrace "${tasks[@]}"
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: wavy-music-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14